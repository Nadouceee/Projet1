<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HUD Tactique - Grimoire de l'Ultime Rituel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="inventory-container">
    <div class="inventory-slot">⚔️</div>
    <div class="inventory-slot">🧪</div>
</div>
<div class="inventory-slot purified-item">💍</div>

<div class="party-container">
    <div class="character-card">🛡️ Guerrier</div>
    <div class="character-card">🗡️ Voleur</div>
    <div class="character-card">🪄 Mage (Vous)</div>
</div>
<div class="spell-book">
    <div class="spell-rune">🔥</div>
    <div class="spell-rune">❄️</div>
    <div class="spell-rune">⚡</div>
    <div class="spell-rune ultimate-spell">🌟 Sort Ultime</div>
    <div class="spell-rune">🍃</div>
    <div class="spell-rune">👁️</div>
</div>
<div class="boss-arena-hud">

    <div class="boss-status-frame">
        <h2 class="boss-name">Ignis Le Dragon de Lave</h2>
        <div class="health-bar-container">
            <div class="health-bar-fluid"></div>
        </div>
    </div>
</div>

<div class="spell-book">
    <div class="spell-rune">🔥</div>
    <div class="spell-rune">❄️</div>
    <div class="spell-rune">⚡</div>
    <div class="spell-rune ultimate-spell">🌟 Sort Ultime</div>
    <div class="spell-rune">🍃</div>
    <div class="spell-rune">👁️</div>
</div>

</body>
</html>
